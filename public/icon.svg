<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- App-Hintergrund mit abgerundeten Ecken (iOS/Android-Stil) -->
  <rect width="512" height="512" rx="115" fill="url(#bg)" />
  
  <!-- Zarter Glow-Effekt -->
  <path d="M256 425.5l-29.35-26.7C121.5 301.5 50 236.5 50 156.5 50 91.5 101.5 40 166.5 40c37.2 0 73 17.5 96.5 45 23.5-27.5 59.3-45 96.5-45C410.5 40 462 91.5 462 156.5c0 80-71.5 145-176.6 242.3L256 425.5z" fill="url(#rose)" opacity="0.25" filter="url(#glow)" />

  <!-- Haupt-Herz & Puls-Symbol -->
  <path d="M256 448l-30.1-27.4C118.5 321.4 48 255.7 48 172.8 48 104.5 102.5 50 170.8 50c39.3 0 77.1 18.5 102.2 47.5C298.1 68.5 335.9 50 375.2 50 443.5 50 498 104.5 498 172.8c0 82.9-70.5 148.6-177.9 247.8L256 448z" fill="url(#rose)" />
  
  <!-- Pulslinie / Herzschlag in der Mitte -->
